name: Play Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.13.4)
        required: true
      track:
        description: Play track
        type: choice
        options: [internal, production]
        default: internal
      whatsnew_fr:
        description: Release notes fr-FR (max 500 chars)
        required: true
      whatsnew_en:
        description: Release notes en-US (max 500 chars)
        required: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build upload-signed AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing, refusing to build a debug-signed bundle for Play."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/upload-keystore.jks"
          chmod +x ./gradlew
          ./gradlew bundleRelease --stacktrace
          rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Check the bundle is not debug-signed
        run: |
          certs=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab)
          echo "$certs" | grep -E "Owner|SHA256"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is debug-signed."
            exit 1
          fi

      - name: Verify 16 KB native-lib alignment
        run: |
          chmod +x scripts/check-16kb-alignment.sh
          ./scripts/check-16kb-alignment.sh app/build/outputs/bundle/release/app-release.aab

      - name: Write release notes
        env:
          WHATSNEW_FR: ${{ inputs.whatsnew_fr }}
          WHATSNEW_EN: ${{ inputs.whatsnew_en }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          printf '%s' "$WHATSNEW_FR" > "$RUNNER_TEMP/whatsnew/whatsnew-fr-FR"
          printf '%s' "$WHATSNEW_EN" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          for f in "$RUNNER_TEMP"/whatsnew/*; do
            n=$(wc -m < "$f")
            if [ "$n" -gt 500 ]; then
              echo "::error::$(basename "$f") is $n characters, Play allows 500."
              exit 1
            fi
          done

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ovh.battistella.ondes
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ inputs.tag }}
          track: ${{ inputs.track }}
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
