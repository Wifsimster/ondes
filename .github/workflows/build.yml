name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ondes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (R8 minified)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ondes-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build release AAB (App Bundle)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/upload-keystore.jks"
            export KEYSTORE_FILE="${{ github.workspace }}/upload-keystore.jks"
          else
            echo "No KEYSTORE_BASE64 secret set — AAB will be debug-signed (not store-ready)."
          fi
          ./gradlew bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ondes-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Verify 16 KB native-lib alignment
        run: |
          chmod +x scripts/check-16kb-alignment.sh
          ./scripts/check-16kb-alignment.sh app/build/outputs/bundle/release/app-release.aab

      - name: Stage download assets (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
          (cd dist && sha256sum app-debug.apk app-release.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish rolling release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ondes — latest build
          prerelease: true
          make_latest: false
          files: |
            dist/app-debug.apk
            dist/app-release.apk
            dist/SHA256SUMS.txt
          body: |
            Automatic build of `main` (commit ${{ github.sha }}).
            No GitHub account needed — tap a link below on your phone.

            | Download | Size | Use it for |
            |---|---|---|
            | [**app-release.apk**](https://github.com/${{ github.repository }}/releases/download/latest/app-release.apk) | ~4 MB | Everyday use (minified) |
            | [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk) | ~25 MB | Debugging / bug reports |

            Then allow *install from unknown sources* when Android asks, and open the file to install.

            Both APKs are debug-signed for sideloading. Verify a download against
            [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/latest/SHA256SUMS.txt)
            with `sha256sum -c SHA256SUMS.txt`.

            Looking for a stable version instead? See the
            [latest release](https://github.com/${{ github.repository }}/releases/latest).
